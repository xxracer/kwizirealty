# Firebase SQL Connect (Data Connect) schema for the Houston real-estate dataset.
#
# Mirrors src/lib/engine.ts PropertyData. Field names are camelCase and map to
# snake_case Postgres columns automatically (closePrice -> close_price, etc.).
# The table is named "properties" (lowercase) with mlsNumber as primary key.
#
# Composite indexes on (boundary, closeDateTs) make the period-filtered
# boundary queries fast; a standalone closeDateTs index covers period-only
# filters. closeDateTs is unix milliseconds stored as Int64 (Int would overflow).

# The decimal fields (pricePerSqft, taxRate, maintFee, taxAmount, lotSize) are
# Float in Postgres — the first deploy created them as Int (values like $93.75
# and 2.8% were rejected), fixed by dataconnect:sql:migrate.
type Property
  @table(name: "properties", key: ["mlsNumber", "datasetYear"])
  @index(fields: ["subdivisions", "closeDateTs"], order: [ASC, DESC])
  @index(fields: ["zipcodes", "closeDateTs"], order: [ASC, DESC])
  @index(fields: ["highschools", "closeDateTs"], order: [ASC, DESC])
  @index(fields: ["elementary", "closeDateTs"], order: [ASC, DESC])
  @index(fields: ["middle", "closeDateTs"], order: [ASC, DESC])
  @index(fields: ["area", "closeDateTs"], order: [ASC, DESC])
  @index(fields: ["polyIdSubdivisions", "closeDateTs"], order: [ASC, DESC])
  @index(fields: ["polyIdZipcodes", "closeDateTs"], order: [ASC, DESC])
  @index(fields: ["polyIdHighschools", "closeDateTs"], order: [ASC, DESC])
  @index(fields: ["polyIdElementary", "closeDateTs"], order: [ASC, DESC])
  @index(fields: ["polyIdMiddle", "closeDateTs"], order: [ASC, DESC])
  @index(fields: ["closeDateTs"])
{
  mlsNumber: String!
  address: String
  city: String
  state: String
  zip: String
  closePrice: Int
  listPrice: Int
  # Decimals in the real data (e.g. $93.75/sqft, 2.8%) — Int rejects them.
  pricePerSqft: Float
  sqft: Int
  lotSize: Float
  br: Int
  baths: Int
  yearBuilt: Int
  dom: Int
  cdom: Int
  closeDate: String
  closeYear: Int
  closeDateTs: Int64
  maintFee: Float
  maintFeeSchedule: String
  taxRate: Float
  taxYear: Int
  taxAmount: Float
  subdivisions: String
  zipcodes: String
  highschools: String
  highschoolName: String
  elementary: String
  middle: String
  schoolDistrict: String
  marketArea: String
  area: String
  lat: Float
  lng: Float
  # Subdivisions polygon this row's lat/lng falls inside, computed at CSV
  # upload time / by the admin assignment job (Point-in-Polygon, smallest
  # containing polygon wins). Empty = no usable coordinates or outside the
  # metro coverage. Subdivisions/neighborhoods aggregates group by this
  # column — NOT by the CSV "Subdivision" text. Same pattern for the other
  # boundary classes fed from BOUNDARY_SOURCES files (zip, schools).
  polyIdSubdivisions: String
  polyIdZipcodes: String
  polyIdHighschools: String
  polyIdElementary: String
  polyIdMiddle: String
  propertyType: String
  pool: Boolean

  # Distinguishes sales records (default) from rental records when both are
  # stored in the same table. Empty/null is treated as a sale.
  listingType: String

  # Dataset year for this row. It lets the same property keep one record per
  # historical year (e.g. tax 2021 vs tax 2022) instead of overwriting the
  # previous upload. Sales/rent rows use closeYear; tax rows use taxYear.
  # Non-null because it is part of the primary key.
  datasetYear: Int!

  # Staging marker for the admin upload flow. Rows imported from the browser
  # are written with a session id; they are invisible to the map until the
  # user clicks "Add All", which sets this column to NULL. If the page is
  # reloaded before committing, pending rows are deleted automatically.
  uploadSessionId: String

  # Last-modification timestamp. Used for ETag/conditional-cache generation so
  # the browser only re-downloads query results when the dataset changes.
  # Populated by the upload/sync code and backed by a Postgres trigger.
  updatedAt: Timestamp
}
