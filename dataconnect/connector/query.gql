# Firebase SQL Connect (Data Connect) operations — connector "default".
#
# Native SQL mode: the WHERE clause replicates src/lib/engine.ts
# filterProperties() exactly (same defaults are no-ops, same derived fields:
# l2s = closePrice/listPrice*100 when listPrice > 0, dom = COALESCE(cdom, dom),
# ppsf = pricePerSqft || closePrice/sqft, estRent = closePrice * 0.008).
#
# School-rating filters are resolved client-side to school-name lists and sent
# as the *Rating params (the TEA score maps live in the browser engine).
#
# Rows are returned md5(mls_number)-ordered so a LIMIT is a deterministic
# uniform sample (same trick the engine uses for low-RAM devices).

query filteredProperties(
  $saleMin: Int!
  $saleMax: Int!
  $sqftMin: Int!
  $sqftMax: Int!
  $yearMin: Int!
  $yearMax: Int!
  $bedsMin: Int!
  $bedsMax: Int!
  $bathsMin: Int!
  $bathsMax: Int!
  $l2sMin: Int!
  $l2sMax: Int!
  $domMin: Int!
  $domMax: Int!
  $lotSizeMin: Int!
  $lotSizeMax: Int!
  $ppsfMin: Int!
  $ppsfMax: Int!
  $rentMin: Int!
  $rentMax: Int!
  $startTs: String
  $endTs: String
  $propertyTypes: [String!]
  $pool: String!
  $schoolDistricts: [String!]
  $cities: [String!]
  $elementaryExplicit: [String!]
  $elementaryRating: [String!]
  $middleExplicit: [String!]
  $middleRating: [String!]
  $highschoolsExplicit: [String!]
  $highSchoolRating: [String!]
  $listingType: String!
  $limit: Int!
) @auth(level: USER) {
  properties: _select(
    sql: """
    SELECT * FROM properties
    WHERE upload_session_id IS NULL
      AND close_price >= $1 AND close_price <= $2
      AND sqft >= $3 AND sqft <= $4
      AND year_built >= $5 AND year_built <= $6
      AND br >= $7 AND br <= $8
      AND baths >= $9 AND baths <= $10
      AND (list_price <= 0 OR ((close_price::float / list_price) * 100 >= $11 AND (close_price::float / list_price) * 100 <= $12))
      AND COALESCE(cdom, dom) >= $13 AND COALESCE(cdom, dom) <= $14
      AND lot_size >= $15 AND lot_size <= $16
      AND COALESCE(price_per_sqft, CASE WHEN sqft > 0 THEN close_price::float / sqft ELSE 0 END) >= $17
      AND COALESCE(price_per_sqft, CASE WHEN sqft > 0 THEN close_price::float / sqft ELSE 0 END) <= $18
      AND (close_price * CASE WHEN $33 = 'rent' THEN 1 ELSE 0.008 END) >= $19
      AND (close_price * CASE WHEN $33 = 'rent' THEN 1 ELSE 0.008 END) <= $20
      AND ($21 IS NULL OR (close_date_ts >= $21::bigint AND close_date_ts <= $22::bigint))
      AND (COALESCE(cardinality($23::text[]), 0) = 0 OR property_type = ANY($23::text[]))
      AND ($24 = 'any' OR ($24 = 'yes' AND pool) OR ($24 = 'no' AND NOT pool))
      AND (COALESCE(cardinality($25::text[]), 0) = 0 OR school_district = ANY($25::text[]))
      AND (COALESCE(cardinality($26::text[]), 0) = 0 OR city = ANY($26::text[]))
      AND (COALESCE(cardinality($27::text[]), 0) = 0 OR elementary = ANY($27::text[]))
      AND (COALESCE(cardinality($28::text[]), 0) = 0 OR elementary = ANY($28::text[]))
      AND (COALESCE(cardinality($29::text[]), 0) = 0 OR middle = ANY($29::text[]))
      AND (COALESCE(cardinality($30::text[]), 0) = 0 OR middle = ANY($30::text[]))
      AND (COALESCE(cardinality($31::text[]), 0) = 0 OR highschools = ANY($31::text[]))
      AND (COALESCE(cardinality($32::text[]), 0) = 0 OR highschool_name = ANY($32::text[]))
      AND (
        $33 = 'both'
        OR listing_type = $33
        OR ($33 = 'sale' AND (listing_type IS NULL OR listing_type = ''))
      )
    ORDER BY md5(mls_number)
    LIMIT $34
    """,
    params: [
      $saleMin, $saleMax, $sqftMin, $sqftMax, $yearMin, $yearMax,
      $bedsMin, $bedsMax, $bathsMin, $bathsMax,
      $l2sMin, $l2sMax, $domMin, $domMax, $lotSizeMin, $lotSizeMax,
      $ppsfMin, $ppsfMax, $rentMin, $rentMax,
      $startTs, $endTs,
      $propertyTypes, $pool, $schoolDistricts, $cities,
      $elementaryExplicit, $elementaryRating,
      $middleExplicit, $middleRating,
      $highschoolsExplicit, $highSchoolRating,
      $listingType, $limit
    ]
  )
}

# Same filters as filteredProperties, but scoped to the selected boundary ids
# (no LIMIT) so area reports are exact even when the map uses a sampled cap.
query filteredPropertiesForSelection(
  $boundary: String!
  $saleMin: Int!
  $saleMax: Int!
  $sqftMin: Int!
  $sqftMax: Int!
  $yearMin: Int!
  $yearMax: Int!
  $bedsMin: Int!
  $bedsMax: Int!
  $bathsMin: Int!
  $bathsMax: Int!
  $l2sMin: Int!
  $l2sMax: Int!
  $domMin: Int!
  $domMax: Int!
  $lotSizeMin: Int!
  $lotSizeMax: Int!
  $ppsfMin: Int!
  $ppsfMax: Int!
  $rentMin: Int!
  $rentMax: Int!
  $startTs: String
  $endTs: String
  $propertyTypes: [String!]
  $pool: String!
  $schoolDistricts: [String!]
  $cities: [String!]
  $elementaryExplicit: [String!]
  $elementaryRating: [String!]
  $middleExplicit: [String!]
  $middleRating: [String!]
  $highschoolsExplicit: [String!]
  $highSchoolRating: [String!]
  $selectedIds: [String!]!
  $listingType: String!
) @auth(level: USER) {
  properties: _select(
    sql: """
    SELECT * FROM properties
    WHERE upload_session_id IS NULL
      AND close_price >= $1 AND close_price <= $2
      AND sqft >= $3 AND sqft <= $4
      AND year_built >= $5 AND year_built <= $6
      AND br >= $7 AND br <= $8
      AND baths >= $9 AND baths <= $10
      AND (list_price <= 0 OR ((close_price::float / list_price) * 100 >= $11 AND (close_price::float / list_price) * 100 <= $12))
      AND COALESCE(cdom, dom) >= $13 AND COALESCE(cdom, dom) <= $14
      AND lot_size >= $15 AND lot_size <= $16
      AND COALESCE(price_per_sqft, CASE WHEN sqft > 0 THEN close_price::float / sqft ELSE 0 END) >= $17
      AND COALESCE(price_per_sqft, CASE WHEN sqft > 0 THEN close_price::float / sqft ELSE 0 END) <= $18
      AND (close_price * CASE WHEN $35 = 'rent' THEN 1 ELSE 0.008 END) >= $19
      AND (close_price * CASE WHEN $35 = 'rent' THEN 1 ELSE 0.008 END) <= $20
      AND ($21 IS NULL OR (close_date_ts >= $21::bigint AND close_date_ts <= $22::bigint))
      AND (COALESCE(cardinality($23::text[]), 0) = 0 OR property_type = ANY($23::text[]))
      AND ($24 = 'any' OR ($24 = 'yes' AND pool) OR ($24 = 'no' AND NOT pool))
      AND (COALESCE(cardinality($25::text[]), 0) = 0 OR school_district = ANY($25::text[]))
      AND (COALESCE(cardinality($26::text[]), 0) = 0 OR city = ANY($26::text[]))
      AND (COALESCE(cardinality($27::text[]), 0) = 0 OR elementary = ANY($27::text[]))
      AND (COALESCE(cardinality($28::text[]), 0) = 0 OR elementary = ANY($28::text[]))
      AND (COALESCE(cardinality($29::text[]), 0) = 0 OR middle = ANY($29::text[]))
      AND (COALESCE(cardinality($30::text[]), 0) = 0 OR middle = ANY($30::text[]))
      AND (COALESCE(cardinality($31::text[]), 0) = 0 OR highschools = ANY($31::text[]))
      AND (COALESCE(cardinality($32::text[]), 0) = 0 OR highschool_name = ANY($32::text[]))
      AND CASE $34
        WHEN 'subdivisions' THEN subdivisions
        WHEN 'neighborhoods' THEN subdivisions
        WHEN 'zipcodes' THEN zipcodes
        WHEN 'highschools' THEN highschools
        WHEN 'elementary' THEN elementary
        WHEN 'middle' THEN middle
        WHEN 'areas' THEN area
        ELSE subdivisions
      END = ANY($33::text[])
      AND (
        $35 = 'both'
        OR listing_type = $35
        OR ($35 = 'sale' AND (listing_type IS NULL OR listing_type = ''))
      )
    """,
    params: [
      $saleMin, $saleMax, $sqftMin, $sqftMax, $yearMin, $yearMax,
      $bedsMin, $bedsMax, $bathsMin, $bathsMax,
      $l2sMin, $l2sMax, $domMin, $domMax, $lotSizeMin, $lotSizeMax,
      $ppsfMin, $ppsfMax, $rentMin, $rentMax,
      $startTs, $endTs,
      $propertyTypes, $pool, $schoolDistricts, $cities,
      $elementaryExplicit, $elementaryRating,
      $middleExplicit, $middleRating,
      $highschoolsExplicit, $highSchoolRating,
      $selectedIds, $boundary, $listingType
    ]
  )
}

# Wipes the table. Used when a NEW published dataset version is detected: SQL
# must mirror the CMS exactly, and deletes in the CMS have to disappear here.
# The sync route then re-ingests every chunk (upsert by mls_number).
mutation clearProperties @auth(level: NO_ACCESS) {
  _execute(sql: "DELETE FROM properties")
}

# Ensure every UPDATE on properties refreshes updated_at automatically. This
# catches manual SQL edits or tools that don't supply the column explicitly.
mutation createUpdatedAtTrigger @auth(level: NO_ACCESS) {
  _execute(sql: """
    CREATE OR REPLACE FUNCTION properties_set_updated_at()
    RETURNS TRIGGER AS $$
    BEGIN
      NEW.updated_at = now();
      RETURN NEW;
    END;
    $$ LANGUAGE plpgsql;

    DROP TRIGGER IF EXISTS properties_updated_at ON properties;
    CREATE TRIGGER properties_updated_at
    BEFORE UPDATE ON properties
    FOR EACH ROW
    EXECUTE FUNCTION properties_set_updated_at();
  """)
}

# Admin upload staging: rows written from the browser carry an upload_session_id.
# They are hidden from the map until the user clicks "Add All".
mutation commitPendingProperties @auth(level: PUBLIC) {
  _execute(sql: "UPDATE properties SET upload_session_id = NULL WHERE upload_session_id IS NOT NULL")
}

mutation clearPendingProperties @auth(level: PUBLIC) {
  _execute(sql: "DELETE FROM properties WHERE upload_session_id IS NOT NULL")
}

mutation commitPendingSession($sessionId: String!) @auth(level: PUBLIC) {
  _execute(sql: "UPDATE properties SET upload_session_id = NULL WHERE upload_session_id = $1", params: [$sessionId])
}

mutation deletePendingSession($sessionId: String!) @auth(level: PUBLIC) {
  _execute(sql: "DELETE FROM properties WHERE upload_session_id = $1", params: [$sessionId])
}

# Browser-side bulk upsert for staging property CSV rows. Rows arrive as a JSON
# array string; each row is keyed by mlsNumber and conflicts are resolved with
# a full UPDATE so re-importing the same file refreshes every column. This
# bypasses the auto-generated Data Connect mutations (there is no built-in
# upsertMany) and avoids routing large CSV payloads through Vercel.
mutation stagePropertyRows($rows: String!) @auth(level: PUBLIC) {
  _execute(sql: """
    WITH batch AS (
      SELECT
        r->>'mlsNumber' AS mls_number,
        r->>'address' AS address,
        r->>'city' AS city,
        r->>'state' AS state,
        r->>'zip' AS zip,
        NULLIF(r->>'closePrice', '')::int AS close_price,
        NULLIF(r->>'listPrice', '')::int AS list_price,
        NULLIF(r->>'pricePerSqft', '')::float AS price_per_sqft,
        NULLIF(r->>'sqft', '')::int AS sqft,
        NULLIF(r->>'lotSize', '')::float AS lot_size,
        NULLIF(r->>'br', '')::int AS br,
        NULLIF(r->>'baths', '')::int AS baths,
        NULLIF(r->>'yearBuilt', '')::int AS year_built,
        NULLIF(r->>'dom', '')::int AS dom,
        NULLIF(r->>'cdom', '')::int AS cdom,
        r->>'closeDate' AS close_date,
        NULLIF(r->>'closeYear', '')::int AS close_year,
        NULLIF(r->>'closeDateTs', '')::bigint AS close_date_ts,
        NULLIF(r->>'maintFee', '')::float AS maint_fee,
        r->>'maintFeeSchedule' AS maint_fee_schedule,
        NULLIF(r->>'taxRate', '')::float AS tax_rate,
        NULLIF(r->>'taxYear', '')::int AS tax_year,
        NULLIF(r->>'taxAmount', '')::float AS tax_amount,
        r->>'subdivisions' AS subdivisions,
        r->>'zipcodes' AS zipcodes,
        r->>'highschools' AS highschools,
        r->>'highschoolName' AS highschool_name,
        r->>'elementary' AS elementary,
        r->>'middle' AS middle,
        r->>'schoolDistrict' AS school_district,
        r->>'marketArea' AS market_area,
        r->>'area' AS area,
        NULLIF(r->>'lat', '')::float AS lat,
        NULLIF(r->>'lng', '')::float AS lng,
        r->>'propertyType' AS property_type,
        (r->>'pool')::boolean AS pool,
        r->>'listingType' AS listing_type,
        NULLIF(r->>'datasetYear', '')::int AS dataset_year,
        r->>'uploadSessionId' AS upload_session_id,
        NULLIF(r->>'updatedAt', '')::timestamptz AS updated_at
      FROM jsonb_array_elements($1::jsonb) AS r
    )
    INSERT INTO properties (
      mls_number, address, city, state, zip, close_price, list_price,
      price_per_sqft, sqft, lot_size, br, baths, year_built, dom, cdom,
      close_date, close_year, close_date_ts, maint_fee, maint_fee_schedule,
      tax_rate, tax_year, tax_amount, subdivisions, zipcodes, highschools,
      highschool_name, elementary, middle, school_district, market_area, area,
      lat, lng, property_type, pool, listing_type, dataset_year, upload_session_id, updated_at
    )
    SELECT
      mls_number, address, city, state, zip, close_price, list_price,
      price_per_sqft, sqft, lot_size, br, baths, year_built, dom, cdom,
      close_date, close_year, close_date_ts, maint_fee, maint_fee_schedule,
      tax_rate, tax_year, tax_amount, subdivisions, zipcodes, highschools,
      highschool_name, elementary, middle, school_district, market_area, area,
      lat, lng, property_type, pool, listing_type, dataset_year, upload_session_id, updated_at
    FROM batch
    ON CONFLICT (mls_number, dataset_year) DO UPDATE SET
      address = EXCLUDED.address,
      city = EXCLUDED.city,
      state = EXCLUDED.state,
      zip = EXCLUDED.zip,
      close_price = EXCLUDED.close_price,
      list_price = EXCLUDED.list_price,
      price_per_sqft = EXCLUDED.price_per_sqft,
      sqft = EXCLUDED.sqft,
      lot_size = EXCLUDED.lot_size,
      br = EXCLUDED.br,
      baths = EXCLUDED.baths,
      year_built = EXCLUDED.year_built,
      dom = EXCLUDED.dom,
      cdom = EXCLUDED.cdom,
      close_date = EXCLUDED.close_date,
      close_year = EXCLUDED.close_year,
      close_date_ts = EXCLUDED.close_date_ts,
      maint_fee = EXCLUDED.maint_fee,
      maint_fee_schedule = EXCLUDED.maint_fee_schedule,
      tax_rate = EXCLUDED.tax_rate,
      tax_year = EXCLUDED.tax_year,
      tax_amount = EXCLUDED.tax_amount,
      subdivisions = EXCLUDED.subdivisions,
      zipcodes = EXCLUDED.zipcodes,
      highschools = EXCLUDED.highschools,
      highschool_name = EXCLUDED.highschool_name,
      elementary = EXCLUDED.elementary,
      middle = EXCLUDED.middle,
      school_district = EXCLUDED.school_district,
      market_area = EXCLUDED.market_area,
      area = EXCLUDED.area,
      lat = EXCLUDED.lat,
      lng = EXCLUDED.lng,
      property_type = EXCLUDED.property_type,
      pool = EXCLUDED.pool,
      listing_type = EXCLUDED.listing_type,
      upload_session_id = EXCLUDED.upload_session_id,
      updated_at = EXCLUDED.updated_at
  """, params: [$rows])
}

# Dataset version for conditional HTTP caching. The ETag of /api/query is
# derived from this timestamp plus a hash of the request body, so unchanged
# data yields a 304 Not Modified with zero payload.
query datasetVersion @auth(level: USER) {
  version: _selectFirst(
    sql: """
    SELECT
      COALESCE(max(updated_at), '1970-01-01T00:00:00Z') AS updated_at,
      count(*) FILTER (WHERE upload_session_id IS NULL) AS total_rows
    FROM properties
    WHERE upload_session_id IS NULL
    """,
    params: []
  )
}

# Row-level search for the map's search box (address / zip / MLS / city).
# $q arrives pre-escaped with % wildcards; escape % and _ in the route.
query searchProperties($q: String!, $limit: Int!) @auth(level: USER) {
  results: _select(
    sql: """
    SELECT * FROM properties
    WHERE upload_session_id IS NULL
      AND (mls_number ILIKE $1
       OR address ILIKE $1
       OR zip ILIKE $1
       OR city ILIKE $1)
    ORDER BY address
    LIMIT $2
    """,
    params: [$q, $limit]
  )
}

# Diagnostic: committed vs pending row counts. Lets the admin see whether
# uploaded CSVs are stuck in staging and invisible to the map.
query datasetStatus @auth(level: PUBLIC) {
  status: _selectFirst(
    sql: """
    SELECT
      count(*) AS total,
      count(*) FILTER (WHERE upload_session_id IS NULL) AS committed,
      count(*) FILTER (WHERE upload_session_id IS NOT NULL) AS pending,
      max(updated_at) AS last_updated
    FROM properties
    """,
    params: []
  )
}

# Dropdown option lists (Property Type, City, School District, schools) in one
# round trip. Empty strings are excluded, matching the engine's unique values.
query distinctValues @auth(level: PUBLIC) {
  values: _selectFirst(
    sql: """
    SELECT
      count(*) FILTER (WHERE upload_session_id IS NULL) AS total_rows,
      array_agg(DISTINCT property_type) FILTER (WHERE property_type <> '' AND upload_session_id IS NULL) AS property_types,
      array_agg(DISTINCT city) FILTER (WHERE city <> '' AND upload_session_id IS NULL) AS cities,
      array_agg(DISTINCT school_district) FILTER (WHERE school_district <> '' AND upload_session_id IS NULL) AS school_districts,
      array_agg(DISTINCT elementary) FILTER (WHERE elementary <> '' AND upload_session_id IS NULL) AS elementary,
      array_agg(DISTINCT middle) FILTER (WHERE middle <> '' AND upload_session_id IS NULL) AS middle,
      array_agg(DISTINCT highschools) FILTER (WHERE highschools <> '' AND upload_session_id IS NULL) AS highschools
    FROM properties
    WHERE upload_session_id IS NULL
    """,
    params: []
  )
}

# ---------------------------------------------------------------------------
# FAST AGGREGATE OPS — the map-values path used to fetch every matching row
# (~0.37 ms/row through the Data Connect layer: 69k rows ≈ 25 s on every map
# load). These ops aggregate IN Postgres instead (GROUP BY / percentiles), so
# the payload is ~20k area rows instead of ~69k full property rows.
#
# The WHERE clause replicates filterProperties() exactly like the ops above.
# The area key replicates getBoundaryKeyFor(): raw column value, NA-ish values
# and empty strings excluded (engine returns '' → row skipped).
# ---------------------------------------------------------------------------
query areaMapValues(
  $boundary: String!
  $saleMin: Int!
  $saleMax: Int!
  $sqftMin: Int!
  $sqftMax: Int!
  $yearMin: Int!
  $yearMax: Int!
  $bedsMin: Int!
  $bedsMax: Int!
  $bathsMin: Int!
  $bathsMax: Int!
  $l2sMin: Int!
  $l2sMax: Int!
  $domMin: Int!
  $domMax: Int!
  $lotSizeMin: Int!
  $lotSizeMax: Int!
  $ppsfMin: Int!
  $ppsfMax: Int!
  $rentMin: Int!
  $rentMax: Int!
  $startTs: String
  $endTs: String
  $propertyTypes: [String!]
  $pool: String!
  $schoolDistricts: [String!]
  $cities: [String!]
  $elementaryExplicit: [String!]
  $elementaryRating: [String!]
  $middleExplicit: [String!]
  $middleRating: [String!]
  $highschoolsExplicit: [String!]
  $highSchoolRating: [String!]
  $listingType: String!
) @auth(level: USER) {
  areas: _select(
    sql: """
    SELECT
      CASE $1::text
        WHEN 'subdivisions' THEN subdivisions
        WHEN 'neighborhoods' THEN subdivisions
        WHEN 'zipcodes' THEN zipcodes
        WHEN 'highschools' THEN highschools
        WHEN 'elementary' THEN elementary
        WHEN 'middle' THEN middle
        WHEN 'areas' THEN area
        ELSE subdivisions
      END AS key,
      COUNT(*)::int AS n,
      percentile_cont(0.5) WITHIN GROUP (ORDER BY close_price) FILTER (WHERE close_price > 0) AS med_close_price,
      percentile_cont(0.5) WITHIN GROUP (ORDER BY COALESCE(price_per_sqft, CASE WHEN sqft > 0 THEN close_price::float / sqft ELSE 0 END)) FILTER (WHERE COALESCE(price_per_sqft, CASE WHEN sqft > 0 THEN close_price::float / sqft ELSE 0 END) > 0) AS med_ppsf,
      percentile_cont(0.5) WITHIN GROUP (ORDER BY list_price::float / sqft) FILTER (WHERE list_price > 0 AND sqft > 0) AS med_ppsf_list,
      percentile_cont(0.5) WITHIN GROUP (ORDER BY CASE WHEN list_price > 0 THEN (close_price::float / list_price) * 100 ELSE 0 END) AS med_l2s,
      percentile_cont(0.5) WITHIN GROUP (ORDER BY CASE WHEN COALESCE(cdom, 0) > 0 THEN cdom ELSE COALESCE(dom, 0) END) AS med_dom,
      percentile_cont(0.5) WITHIN GROUP (ORDER BY close_price * CASE WHEN $34 = 'rent' THEN 1 ELSE 0.008 END) FILTER (WHERE close_price > 0) AS med_rent,
      percentile_cont(0.5) WITHIN GROUP (ORDER BY 0.096) FILTER (WHERE close_price > 0) AS med_rts,
      percentile_cont(0.5) WITHIN GROUP (ORDER BY (close_price * CASE WHEN $34 = 'rent' THEN 1 ELSE 0.008 END) / sqft) FILTER (WHERE sqft > 0 AND close_price > 0) AS med_rent_psf,
      percentile_cont(0.5) WITHIN GROUP (ORDER BY ROUND((CASE WHEN COALESCE(cdom, 0) > 0 THEN cdom ELSE COALESCE(dom, 0) END) * CASE WHEN $34 = 'rent' THEN 1 ELSE 0.85 END)) FILTER (WHERE (CASE WHEN COALESCE(cdom, 0) > 0 THEN cdom ELSE COALESCE(dom, 0) END) > 0) AS med_rent_dom,
      percentile_cont(0.5) WITHIN GROUP (ORDER BY lot_size) FILTER (WHERE lot_size > 0) AS med_lot,
      percentile_cont(0.5) WITHIN GROUP (ORDER BY CASE WHEN maint_fee_schedule LIKE '%month%' THEN maint_fee * 12 WHEN maint_fee_schedule LIKE '%quarter%' THEN maint_fee * 4 WHEN maint_fee_schedule LIKE '%semi%' OR maint_fee_schedule LIKE '%half%' THEN maint_fee * 2 ELSE maint_fee END) FILTER (WHERE maint_fee > 0) AS med_hoa,
      percentile_cont(0.5) WITHIN GROUP (ORDER BY COALESCE(tax_rate, 0)) AS med_tax_rate
    FROM properties
    WHERE upload_session_id IS NULL
      AND close_price >= $2 AND close_price <= $3
      AND sqft >= $4 AND sqft <= $5
      AND year_built >= $6 AND year_built <= $7
      AND br >= $8 AND br <= $9
      AND baths >= $10 AND baths <= $11
      AND (list_price <= 0 OR ((close_price::float / list_price) * 100 >= $12 AND (close_price::float / list_price) * 100 <= $13))
      AND COALESCE(cdom, dom) >= $14 AND COALESCE(cdom, dom) <= $15
      AND lot_size >= $16 AND lot_size <= $17
      AND COALESCE(price_per_sqft, CASE WHEN sqft > 0 THEN close_price::float / sqft ELSE 0 END) >= $18
      AND COALESCE(price_per_sqft, CASE WHEN sqft > 0 THEN close_price::float / sqft ELSE 0 END) <= $19
      AND (close_price * CASE WHEN $34 = 'rent' THEN 1 ELSE 0.008 END) >= $20
      AND (close_price * CASE WHEN $34 = 'rent' THEN 1 ELSE 0.008 END) <= $21
      AND ($22 IS NULL OR (close_date_ts >= $22::bigint AND close_date_ts <= $23::bigint))
      AND (COALESCE(cardinality($24::text[]), 0) = 0 OR property_type = ANY($24::text[]))
      AND ($25 = 'any' OR ($25 = 'yes' AND pool) OR ($25 = 'no' AND NOT pool))
      AND (COALESCE(cardinality($26::text[]), 0) = 0 OR school_district = ANY($26::text[]))
      AND (COALESCE(cardinality($27::text[]), 0) = 0 OR city = ANY($27::text[]))
      AND (COALESCE(cardinality($28::text[]), 0) = 0 OR elementary = ANY($28::text[]))
      AND (COALESCE(cardinality($29::text[]), 0) = 0 OR elementary = ANY($29::text[]))
      AND (COALESCE(cardinality($30::text[]), 0) = 0 OR middle = ANY($30::text[]))
      AND (COALESCE(cardinality($31::text[]), 0) = 0 OR middle = ANY($31::text[]))
      AND (COALESCE(cardinality($32::text[]), 0) = 0 OR highschools = ANY($32::text[]))
      AND (COALESCE(cardinality($33::text[]), 0) = 0 OR highschool_name = ANY($33::text[]))
      AND (CASE $1::text
        WHEN 'subdivisions' THEN subdivisions
        WHEN 'neighborhoods' THEN subdivisions
        WHEN 'zipcodes' THEN zipcodes
        WHEN 'highschools' THEN highschools
        WHEN 'elementary' THEN elementary
        WHEN 'middle' THEN middle
        WHEN 'areas' THEN area
        ELSE subdivisions
      END) <> ''
      AND (CASE $1::text
        WHEN 'subdivisions' THEN subdivisions
        WHEN 'neighborhoods' THEN subdivisions
        WHEN 'zipcodes' THEN zipcodes
        WHEN 'highschools' THEN highschools
        WHEN 'elementary' THEN elementary
        WHEN 'middle' THEN middle
        WHEN 'areas' THEN area
        ELSE subdivisions
      END) NOT IN ('NA', 'N/A', 'NONE', 'NULL', 'UNKNOWN', 'UNINCORPORATED')
      AND (
        $34 = 'both'
        OR listing_type = $34
        OR ($34 = 'sale' AND (listing_type IS NULL OR listing_type = ''))
      )
    GROUP BY 1
    """,
    params: [
      $boundary,
      $saleMin, $saleMax, $sqftMin, $sqftMax, $yearMin, $yearMax,
      $bedsMin, $bedsMax, $bathsMin, $bathsMax,
      $l2sMin, $l2sMax, $domMin, $domMax, $lotSizeMin, $lotSizeMax,
      $ppsfMin, $ppsfMax, $rentMin, $rentMax,
      $startTs, $endTs,
      $propertyTypes, $pool, $schoolDistricts, $cities,
      $elementaryExplicit, $elementaryRating,
      $middleExplicit, $middleRating,
      $highschoolsExplicit, $highSchoolRating,
      $listingType
    ]
  )
}

# Market-wide (no-selection) aggregates for the report panel: Quick Stats,
# market health medians and the year-built distribution — one row.
query overallAggregates(
  $saleMin: Int!
  $saleMax: Int!
  $sqftMin: Int!
  $sqftMax: Int!
  $yearMin: Int!
  $yearMax: Int!
  $bedsMin: Int!
  $bedsMax: Int!
  $bathsMin: Int!
  $bathsMax: Int!
  $l2sMin: Int!
  $l2sMax: Int!
  $domMin: Int!
  $domMax: Int!
  $lotSizeMin: Int!
  $lotSizeMax: Int!
  $ppsfMin: Int!
  $ppsfMax: Int!
  $rentMin: Int!
  $rentMax: Int!
  $startTs: String
  $endTs: String
  $propertyTypes: [String!]
  $pool: String!
  $schoolDistricts: [String!]
  $cities: [String!]
  $elementaryExplicit: [String!]
  $elementaryRating: [String!]
  $middleExplicit: [String!]
  $middleRating: [String!]
  $highschoolsExplicit: [String!]
  $highSchoolRating: [String!]
  $listingType: String!
) @auth(level: USER) {
  totals: _selectFirst(
    sql: """
    SELECT
      COUNT(*)::int AS n,
      SUM(close_price) AS total_volume,
      SUM(close_price) FILTER (WHERE sqft > 0) AS sqft_sale_sum,
      SUM(sqft) FILTER (WHERE sqft > 0) AS sqft_sum,
      SUM(list_price) FILTER (WHERE list_price > 0) AS list_sum,
      COUNT(*) FILTER (WHERE list_price > 0)::int AS list_count,
      AVG(CASE WHEN COALESCE(cdom, 0) > 0 THEN cdom ELSE COALESCE(dom, 0) END) FILTER (WHERE (CASE WHEN COALESCE(cdom, 0) > 0 THEN cdom ELSE COALESCE(dom, 0) END) > 0) AS avg_dom,
      AVG(lot_size) FILTER (WHERE lot_size > 0) AS avg_lot,
      AVG(tax_amount) FILTER (WHERE tax_amount > 0) AS avg_tax_amount,
      COUNT(*) FILTER (WHERE tax_amount > 0)::int AS tax_count,
      AVG(tax_rate) FILTER (WHERE tax_rate > 0) AS avg_tax_rate,
      percentile_cont(0.5) WITHIN GROUP (ORDER BY CASE WHEN COALESCE(cdom, 0) > 0 THEN cdom ELSE COALESCE(dom, 0) END) FILTER (WHERE (CASE WHEN COALESCE(cdom, 0) > 0 THEN cdom ELSE COALESCE(dom, 0) END) > 0) AS med_dom,
      percentile_cont(0.5) WITHIN GROUP (ORDER BY (close_price::float / list_price) * 100) FILTER (WHERE list_price > 0) AS med_l2s,
      COUNT(*) FILTER (WHERE year_built > 0 AND year_built < 1970)::int AS era1,
      COUNT(*) FILTER (WHERE year_built >= 1970 AND year_built < 1990)::int AS era2,
      COUNT(*) FILTER (WHERE year_built >= 1990 AND year_built < 2010)::int AS era3,
      COUNT(*) FILTER (WHERE year_built >= 2010)::int AS era4
    FROM properties
    WHERE upload_session_id IS NULL
      AND close_price >= $1 AND close_price <= $2
      AND sqft >= $3 AND sqft <= $4
      AND year_built >= $5 AND year_built <= $6
      AND br >= $7 AND br <= $8
      AND baths >= $9 AND baths <= $10
      AND (list_price <= 0 OR ((close_price::float / list_price) * 100 >= $11 AND (close_price::float / list_price) * 100 <= $12))
      AND COALESCE(cdom, dom) >= $13 AND COALESCE(cdom, dom) <= $14
      AND lot_size >= $15 AND lot_size <= $16
      AND COALESCE(price_per_sqft, CASE WHEN sqft > 0 THEN close_price::float / sqft ELSE 0 END) >= $17
      AND COALESCE(price_per_sqft, CASE WHEN sqft > 0 THEN close_price::float / sqft ELSE 0 END) <= $18
      AND (close_price * CASE WHEN $33 = 'rent' THEN 1 ELSE 0.008 END) >= $19
      AND (close_price * CASE WHEN $33 = 'rent' THEN 1 ELSE 0.008 END) <= $20
      AND ($21 IS NULL OR (close_date_ts >= $21::bigint AND close_date_ts <= $22::bigint))
      AND (COALESCE(cardinality($23::text[]), 0) = 0 OR property_type = ANY($23::text[]))
      AND ($24 = 'any' OR ($24 = 'yes' AND pool) OR ($24 = 'no' AND NOT pool))
      AND (COALESCE(cardinality($25::text[]), 0) = 0 OR school_district = ANY($25::text[]))
      AND (COALESCE(cardinality($26::text[]), 0) = 0 OR city = ANY($26::text[]))
      AND (COALESCE(cardinality($27::text[]), 0) = 0 OR elementary = ANY($27::text[]))
      AND (COALESCE(cardinality($28::text[]), 0) = 0 OR elementary = ANY($28::text[]))
      AND (COALESCE(cardinality($29::text[]), 0) = 0 OR middle = ANY($29::text[]))
      AND (COALESCE(cardinality($30::text[]), 0) = 0 OR middle = ANY($30::text[]))
      AND (COALESCE(cardinality($31::text[]), 0) = 0 OR highschools = ANY($31::text[]))
      AND (COALESCE(cardinality($32::text[]), 0) = 0 OR highschool_name = ANY($32::text[]))
      AND (
        $33 = 'both'
        OR listing_type = $33
        OR ($33 = 'sale' AND (listing_type IS NULL OR listing_type = ''))
      )
    """,
    params: [
      $saleMin, $saleMax, $sqftMin, $sqftMax, $yearMin, $yearMax,
      $bedsMin, $bedsMax, $bathsMin, $bathsMax,
      $l2sMin, $l2sMax, $domMin, $domMax, $lotSizeMin, $lotSizeMax,
      $ppsfMin, $ppsfMax, $rentMin, $rentMax,
      $startTs, $endTs,
      $propertyTypes, $pool, $schoolDistricts, $cities,
      $elementaryExplicit, $elementaryRating,
      $middleExplicit, $middleRating,
      $highschoolsExplicit, $highSchoolRating,
      $listingType
    ]
  )
}

# Monthly time series (whole filtered set, no selection): period + count +
# median per derivable metric. Mirrors engine.getTimeSeries' monthly buckets;
# the weekly fallback (<3 monthly buckets) is handled by the caller falling
# back to the full-row path. closeDateTs is a UTC-midnight epoch, so bucketing
# in the market's timezone (America/Chicago) matches the browser's local-time
# month keys.
query monthlyTimeSeries(
  $saleMin: Int!
  $saleMax: Int!
  $sqftMin: Int!
  $sqftMax: Int!
  $yearMin: Int!
  $yearMax: Int!
  $bedsMin: Int!
  $bedsMax: Int!
  $bathsMin: Int!
  $bathsMax: Int!
  $l2sMin: Int!
  $l2sMax: Int!
  $domMin: Int!
  $domMax: Int!
  $lotSizeMin: Int!
  $lotSizeMax: Int!
  $ppsfMin: Int!
  $ppsfMax: Int!
  $rentMin: Int!
  $rentMax: Int!
  $startTs: String
  $endTs: String
  $propertyTypes: [String!]
  $pool: String!
  $schoolDistricts: [String!]
  $cities: [String!]
  $elementaryExplicit: [String!]
  $elementaryRating: [String!]
  $middleExplicit: [String!]
  $middleRating: [String!]
  $highschoolsExplicit: [String!]
  $highSchoolRating: [String!]
  $listingType: String!
) @auth(level: USER) {
  series: _select(
    sql: """
    SELECT
      to_char(to_timestamp(close_date_ts / 1000.0) AT TIME ZONE 'America/Chicago', 'YYYY-MM') AS period,
      COUNT(*)::int AS n,
      percentile_cont(0.5) WITHIN GROUP (ORDER BY close_price) FILTER (WHERE close_price > 0) AS med_close_price,
      percentile_cont(0.5) WITHIN GROUP (ORDER BY COALESCE(price_per_sqft, CASE WHEN sqft > 0 THEN close_price::float / sqft ELSE 0 END)) FILTER (WHERE COALESCE(price_per_sqft, CASE WHEN sqft > 0 THEN close_price::float / sqft ELSE 0 END) > 0) AS med_ppsf,
      percentile_cont(0.5) WITHIN GROUP (ORDER BY list_price::float / sqft) FILTER (WHERE list_price > 0 AND sqft > 0) AS med_ppsf_list,
      percentile_cont(0.5) WITHIN GROUP (ORDER BY CASE WHEN list_price > 0 THEN (close_price::float / list_price) * 100 ELSE 0 END) AS med_l2s,
      percentile_cont(0.5) WITHIN GROUP (ORDER BY CASE WHEN COALESCE(cdom, 0) > 0 THEN cdom ELSE COALESCE(dom, 0) END) AS med_dom,
      percentile_cont(0.5) WITHIN GROUP (ORDER BY close_price * CASE WHEN $33 = 'rent' THEN 1 ELSE 0.008 END) FILTER (WHERE close_price > 0) AS med_rent,
      percentile_cont(0.5) WITHIN GROUP (ORDER BY (close_price * CASE WHEN $33 = 'rent' THEN 1 ELSE 0.008 END) / sqft) FILTER (WHERE sqft > 0 AND close_price > 0) AS med_rent_psf,
      percentile_cont(0.5) WITHIN GROUP (ORDER BY lot_size) FILTER (WHERE lot_size > 0) AS med_lot,
      percentile_cont(0.5) WITHIN GROUP (ORDER BY CASE WHEN maint_fee_schedule LIKE '%month%' THEN maint_fee * 12 WHEN maint_fee_schedule LIKE '%quarter%' THEN maint_fee * 4 WHEN maint_fee_schedule LIKE '%semi%' OR maint_fee_schedule LIKE '%half%' THEN maint_fee * 2 ELSE maint_fee END) FILTER (WHERE maint_fee > 0) AS med_hoa,
      percentile_cont(0.5) WITHIN GROUP (ORDER BY COALESCE(tax_rate, 0)) AS med_tax_rate
    FROM properties
    WHERE upload_session_id IS NULL
      AND close_price >= $1 AND close_price <= $2
      AND sqft >= $3 AND sqft <= $4
      AND year_built >= $5 AND year_built <= $6
      AND br >= $7 AND br <= $8
      AND baths >= $9 AND baths <= $10
      AND (list_price <= 0 OR ((close_price::float / list_price) * 100 >= $11 AND (close_price::float / list_price) * 100 <= $12))
      AND COALESCE(cdom, dom) >= $13 AND COALESCE(cdom, dom) <= $14
      AND lot_size >= $15 AND lot_size <= $16
      AND COALESCE(price_per_sqft, CASE WHEN sqft > 0 THEN close_price::float / sqft ELSE 0 END) >= $17
      AND COALESCE(price_per_sqft, CASE WHEN sqft > 0 THEN close_price::float / sqft ELSE 0 END) <= $18
      AND (close_price * CASE WHEN $33 = 'rent' THEN 1 ELSE 0.008 END) >= $19
      AND (close_price * CASE WHEN $33 = 'rent' THEN 1 ELSE 0.008 END) <= $20
      AND ($21 IS NULL OR (close_date_ts >= $21::bigint AND close_date_ts <= $22::bigint))
      AND (COALESCE(cardinality($23::text[]), 0) = 0 OR property_type = ANY($23::text[]))
      AND ($24 = 'any' OR ($24 = 'yes' AND pool) OR ($24 = 'no' AND NOT pool))
      AND (COALESCE(cardinality($25::text[]), 0) = 0 OR school_district = ANY($25::text[]))
      AND (COALESCE(cardinality($26::text[]), 0) = 0 OR city = ANY($26::text[]))
      AND (COALESCE(cardinality($27::text[]), 0) = 0 OR elementary = ANY($27::text[]))
      AND (COALESCE(cardinality($28::text[]), 0) = 0 OR elementary = ANY($28::text[]))
      AND (COALESCE(cardinality($29::text[]), 0) = 0 OR middle = ANY($29::text[]))
      AND (COALESCE(cardinality($30::text[]), 0) = 0 OR middle = ANY($30::text[]))
      AND (COALESCE(cardinality($31::text[]), 0) = 0 OR highschools = ANY($31::text[]))
      AND (COALESCE(cardinality($32::text[]), 0) = 0 OR highschool_name = ANY($32::text[]))
      AND close_date_ts > 0
      AND (
        $33 = 'both'
        OR listing_type = $33
        OR ($33 = 'sale' AND (listing_type IS NULL OR listing_type = ''))
      )
    GROUP BY 1
    ORDER BY 1
    """,
    params: [
      $saleMin, $saleMax, $sqftMin, $sqftMax, $yearMin, $yearMax,
      $bedsMin, $bedsMax, $bathsMin, $bathsMax,
      $l2sMin, $l2sMax, $domMin, $domMax, $lotSizeMin, $lotSizeMax,
      $ppsfMin, $ppsfMax, $rentMin, $rentMax,
      $startTs, $endTs,
      $propertyTypes, $pool, $schoolDistricts, $cities,
      $elementaryExplicit, $elementaryRating,
      $middleExplicit, $middleRating,
      $highschoolsExplicit, $highSchoolRating,
      $listingType
    ]
  )
}

# Point sample for the map's sales/rental dots layer (md5-ordered, like the
# legacy path) — lat/lng only so the transfer stays tiny.
query mapPoints(
  $limit: Int!
  $saleMin: Int!
  $saleMax: Int!
  $sqftMin: Int!
  $sqftMax: Int!
  $yearMin: Int!
  $yearMax: Int!
  $bedsMin: Int!
  $bedsMax: Int!
  $bathsMin: Int!
  $bathsMax: Int!
  $l2sMin: Int!
  $l2sMax: Int!
  $domMin: Int!
  $domMax: Int!
  $lotSizeMin: Int!
  $lotSizeMax: Int!
  $ppsfMin: Int!
  $ppsfMax: Int!
  $rentMin: Int!
  $rentMax: Int!
  $startTs: String
  $endTs: String
  $propertyTypes: [String!]
  $pool: String!
  $schoolDistricts: [String!]
  $cities: [String!]
  $elementaryExplicit: [String!]
  $elementaryRating: [String!]
  $middleExplicit: [String!]
  $middleRating: [String!]
  $highschoolsExplicit: [String!]
  $highSchoolRating: [String!]
  $listingType: String!
) @auth(level: USER) {
  points: _select(
    sql: """
    SELECT lat, lng FROM properties
    WHERE upload_session_id IS NULL
      AND close_price >= $2 AND close_price <= $3
      AND sqft >= $4 AND sqft <= $5
      AND year_built >= $6 AND year_built <= $7
      AND br >= $8 AND br <= $9
      AND baths >= $10 AND baths <= $11
      AND (list_price <= 0 OR ((close_price::float / list_price) * 100 >= $12 AND (close_price::float / list_price) * 100 <= $13))
      AND COALESCE(cdom, dom) >= $14 AND COALESCE(cdom, dom) <= $15
      AND lot_size >= $16 AND lot_size <= $17
      AND COALESCE(price_per_sqft, CASE WHEN sqft > 0 THEN close_price::float / sqft ELSE 0 END) >= $18
      AND COALESCE(price_per_sqft, CASE WHEN sqft > 0 THEN close_price::float / sqft ELSE 0 END) <= $19
      AND (close_price * CASE WHEN $34 = 'rent' THEN 1 ELSE 0.008 END) >= $20
      AND (close_price * CASE WHEN $34 = 'rent' THEN 1 ELSE 0.008 END) <= $21
      AND ($22 IS NULL OR (close_date_ts >= $22::bigint AND close_date_ts <= $23::bigint))
      AND (COALESCE(cardinality($24::text[]), 0) = 0 OR property_type = ANY($24::text[]))
      AND ($25 = 'any' OR ($25 = 'yes' AND pool) OR ($25 = 'no' AND NOT pool))
      AND (COALESCE(cardinality($26::text[]), 0) = 0 OR school_district = ANY($26::text[]))
      AND (COALESCE(cardinality($27::text[]), 0) = 0 OR city = ANY($27::text[]))
      AND (COALESCE(cardinality($28::text[]), 0) = 0 OR elementary = ANY($28::text[]))
      AND (COALESCE(cardinality($29::text[]), 0) = 0 OR elementary = ANY($29::text[]))
      AND (COALESCE(cardinality($30::text[]), 0) = 0 OR middle = ANY($30::text[]))
      AND (COALESCE(cardinality($31::text[]), 0) = 0 OR middle = ANY($31::text[]))
      AND (COALESCE(cardinality($32::text[]), 0) = 0 OR highschools = ANY($32::text[]))
      AND (COALESCE(cardinality($33::text[]), 0) = 0 OR highschool_name = ANY($33::text[]))
      AND (
        $34 = 'both'
        OR listing_type = $34
        OR ($34 = 'sale' AND (listing_type IS NULL OR listing_type = ''))
      )
    ORDER BY md5(mls_number)
    LIMIT $1
    """,
    params: [
      $limit,
      $saleMin, $saleMax, $sqftMin, $sqftMax, $yearMin, $yearMax,
      $bedsMin, $bedsMax, $bathsMin, $bathsMax,
      $l2sMin, $l2sMax, $domMin, $domMax, $lotSizeMin, $lotSizeMax,
      $ppsfMin, $ppsfMax, $rentMin, $rentMax,
      $startTs, $endTs,
      $propertyTypes, $pool, $schoolDistricts, $cities,
      $elementaryExplicit, $elementaryRating,
      $middleExplicit, $middleRating,
      $highschoolsExplicit, $highSchoolRating,
      $listingType
    ]
  )
}